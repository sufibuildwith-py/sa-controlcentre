name: Production installers
on:
  workflow_dispatch:
  push:
    tags: ['release-*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - name: Production backend without demo components
        run: mvn -f apps/backend/pom.xml -Pproduction-desktop clean package "-Dmaven.test.skip=true"
      - run: npm ci
        working-directory: apps/desktop
      - run: node scripts/prepare-release.mjs
      - name: Production installer
        run: npm run tauri -- build --features production --config src-tauri/tauri.production.conf.json
        working-directory: apps/desktop
      - name: macOS runtime smoke
        if: runner.os == 'macOS'
        run: |
          apps/desktop/src-tauri/runtime/jre/bin/java -version
          apps/desktop/src-tauri/runtime/postgres/bin/postgres --version
          test -d apps/desktop/src-tauri/target/release/bundle/macos/SA\ Command.app
      - uses: actions/upload-artifact@v4
        with:
          name: SA-Command-1.2.0-${{ runner.os }}-unsigned
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
