services:
  - type: web
    name: sa-command-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: apps/backend
    dockerfilePath: Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: APP_MODE
        value: production
      - key: APP_TIME_ZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: sa-command-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: sa-command-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: sa-command-db
          property: password
      - key: DESKTOP_ORIGINS
        value: https://sa-command.vercel.app,tauri://localhost,http://tauri.localhost
      - key: MESSAGING_PROVIDER
        value: unconfigured
      - key: EVE_MODEL_PROVIDER
        value: TEST
      - key: FINANCE_UNLOCK_CODE_HASH
        generateValue: false
      - key: FINANCE_ACCESS_TTL_MINUTES
        value: "30"
      - key: BOOTSTRAP_OWNER_EMAIL
        value: owner@saproduction.in
      - key: BOOTSTRAP_OWNER_NAME
        value: SA Production Owner
      - key: NAVIGATOR_ENABLED
        value: "true"
      - key: NAVIGATOR_GATEWAY_URL
        value: https://sa-navigator-gateway-production.up.railway.app
      - key: NAVIGATOR_SERVICE_KEY
        generateValue: false
      - key: NAVIGATOR_ORGANIZATION_PUBLIC_ID
        value: 6be51f4b-e5bd-4e91-8d60-4e41a72ad86f
      - key: NAVIGATOR_SIMULATOR_ENABLED
        value: "false"

databases:
  - name: sa-command-db
    plan: free
    region: oregon
    databaseName: sa_command_prod
    user: sa_command_user
