spring:
  application:
    name: sa-command
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sa_command}
    username: ${DATABASE_USERNAME:sa_command}
    password: ${DATABASE_PASSWORD:sa_command_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never
server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        name: SA_COMMAND_SESSION
        http-only: true
        same-site: strict
      timeout: 12h
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  mode: ${APP_MODE:development}
  demo-seed: ${DEMO_SEED:false}
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  payroll:
    policy: ${PAYROLL_POLICY:PER_WORKING_DAY}
    working-days: ${PAYROLL_WORKING_DAYS:26}
  messaging:
    provider: ${MESSAGING_PROVIDER:console}
    worker-enabled: ${MESSAGING_WORKER_ENABLED:true}
    poll-ms: ${MESSAGING_POLL_MS:1000}
    max-attempts: ${MESSAGING_MAX_ATTEMPTS:4}
    meta:
      graph-api-version: ${META_WHATSAPP_API_VERSION:v23.0}
      template-language: ${META_WHATSAPP_TEMPLATE_LANGUAGE:en_US}
      phone-number-id: ${META_WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${META_WHATSAPP_ACCESS_TOKEN:}
      app-secret: ${META_WHATSAPP_APP_SECRET:}
  finance:
    unlock-code-hash: ${FINANCE_UNLOCK_CODE_HASH:dd7a0bb1db3c404e514d61d0b8025f2c0a6023a17fb74c4461c38bf951d9ee47}
    access-ttl-minutes: ${FINANCE_ACCESS_TTL_MINUTES:30}
  desktop-origins: ${DESKTOP_ORIGINS:http://localhost:1420,tauri://localhost,http://tauri.localhost}
  navigator:
    enabled: ${NAVIGATOR_ENABLED:false}
    gateway-url: ${NAVIGATOR_GATEWAY_URL:http://127.0.0.1:8091}
    organization-public-id: ${NAVIGATOR_ORGANIZATION_PUBLIC_ID:6be51f4b-e5bd-4e91-8d60-4e41a72ad86f}
    service-key: ${NAVIGATOR_SERVICE_KEY:}
    simulator-enabled: ${NAVIGATOR_SIMULATOR_ENABLED:false}
  eve:
    model-provider: ${EVE_MODEL_PROVIDER:TEST}
    local:
      model-path: ${EVE_MODEL_PATH:${EVE_LOCAL_MODEL_PATH:eve/models/Qwen3-4B-Thinking-2507.Q4_K_M.gguf}}
      binary-path: ${EVE_LOCAL_INFERENCE_PATH:eve/runtime/llama-server/llama-server.exe}
      server-url: ${EVE_LOCAL_MODEL_URL:http://127.0.0.1:8090}
      port: ${EVE_MODEL_PORT:${EVE_LOCAL_MODEL_PORT:8090}}
      threads: ${EVE_LOCAL_THREADS:6}
      ctx-size: ${EVE_LOCAL_CTX_SIZE:4096}
      gpu-layers: ${EVE_LOCAL_GPU_LAYERS:0}
      reasoning-budget: ${EVE_REASONING_BUDGET:1024}
    semantic:
      enabled: ${EVE_SEMANTIC_ENABLED:true}
      provider: ${EVE_SEMANTIC_PROVIDER:TEST}
      embedding:
        model-path: ${EVE_EMBEDDING_MODEL_PATH:eve/models/Qwen3-Embedding-0.6B-Q8_0.gguf}
        binary-path: ${EVE_EMBEDDING_BINARY_PATH:eve/runtime/llama-server/llama-server.exe}
        server-url: ${EVE_EMBEDDING_URL:http://127.0.0.1:8087}
        port: ${EVE_EMBEDDING_PORT:8087}
        threads: ${EVE_EMBEDDING_THREADS:4}
        ctx-size: ${EVE_EMBEDDING_CTX_SIZE:2048}
        gpu-layers: ${EVE_EMBEDDING_GPU_LAYERS:0}
        dimensions: ${EVE_EMBEDDING_DIMENSIONS:1024}
        timeout-ms: ${EVE_EMBEDDING_TIMEOUT_MS:4000}
      reranker:
        model-path: ${EVE_RERANKER_MODEL_PATH:eve/models/Qwen3-Reranker-0.6B-Q8_0.gguf}
        binary-path: ${EVE_RERANKER_BINARY_PATH:eve/runtime/llama-server/llama-server.exe}
        server-url: ${EVE_RERANKER_URL:http://127.0.0.1:8088}
        port: ${EVE_RERANKER_PORT:8088}
        threads: ${EVE_RERANKER_THREADS:4}
        ctx-size: ${EVE_RERANKER_CTX_SIZE:2048}
        gpu-layers: ${EVE_RERANKER_GPU_LAYERS:0}
        timeout-ms: ${EVE_RERANKER_TIMEOUT_MS:4000}
      resolver:
        min-score: ${EVE_SEMANTIC_MIN_SCORE:0.35}
        min-margin: ${EVE_SEMANTIC_MIN_MARGIN:0.08}
        max-candidates: ${EVE_SEMANTIC_MAX_CANDIDATES:20}
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
