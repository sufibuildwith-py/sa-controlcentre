services:
  postgres:
    image: postgres:17-alpine
    container_name: sa-command-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sa_command}
      POSTGRES_USER: ${POSTGRES_USER:-sa_command}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sa_command_dev}
    ports:
      - "5432:5432"
    volumes:
      - sa_command_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sa_command_postgres:

